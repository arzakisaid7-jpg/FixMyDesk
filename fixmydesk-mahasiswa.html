<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FixMyDesk - Mahasiswa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --biru: #2c4a5a;
      --biru-muda: #edf2f7;
      --teal: #319795;
      --teal-tua: #276b6a;
      --teks: #1a2530;
      --abu: #5a6e7a;
      --putih: #fff;
      --merah: #c0504d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 10% 10%, rgba(200, 230, 235, 0.45) 0%, transparent 40%),
                  radial-gradient(circle at 90% 90%, rgba(215, 235, 230, 0.45) 0%, transparent 40%),
                  #edf2f7;
      color: var(--teks);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== HEADER ===== */
    header {
      background: rgba(30, 58, 74, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--putih);
      padding: 18px 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
      position: sticky;
      top: 0;
      z-index: 40;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      letter-spacing: -0.4px;
    }

    header h1 i {
      font-size: 24px;
      color: #5dd9d2;
    }

    header small {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      opacity: .75;
      font-weight: 400;
    }

    main {
      max-width: 580px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    /* ===== KARTU ===== */
    .kartu {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 18px;
      box-shadow: 0 10px 25px -5px rgba(26, 37, 48, 0.05), 0 8px 10px -6px rgba(26, 37, 48, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.8);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .kartu:hover {
      box-shadow: 0 14px 30px -4px rgba(26, 37, 48, 0.08), 0 10px 12px -5px rgba(26, 37, 48, 0.03);
    }

    h2 {
      margin: 0 0 14px;
      font-size: 19px;
      color: var(--biru);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.2px;
    }

    label {
      display: block;
      font-size: 12.5px;
      margin: 14px 0 6px;
      color: var(--abu);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    input[type=text],
    input[type=password],
    textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #d4dfe6;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      background: #fafbfc;
      transition: all 0.2s ease;
    }

    input[type=text]:focus,
    input[type=password]:focus,
    textarea:focus {
      outline: none;
      background: #fff;
      border-color: var(--teal);
      box-shadow: 0 0 0 4px rgba(49, 151, 149, 0.14);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* ===== TOMBOL ===== */
    button {
      font-family: inherit;
      font-size: 15px;
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 600;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      letter-spacing: -0.1px;
    }

    .utama {
      background: linear-gradient(135deg, #319795 0%, #206d6b 100%);
      color: var(--putih);
      width: 100%;
      font-weight: 700;
      margin-top: 16px;
      box-shadow: 0 4px 14px rgba(49, 151, 149, 0.35);
    }

    .utama:hover {
      background: linear-gradient(135deg, #288482 0%, #175452 100%);
      box-shadow: 0 6px 18px rgba(49, 151, 149, 0.45);
      transform: translateY(-2px);
    }

    .sekunder {
      background: #edf3f7;
      color: var(--biru);
      width: 100%;
      margin-top: 8px;
      font-weight: 600;
      border: 1px solid rgba(44, 74, 90, 0.08);
    }

    .sekunder:hover {
      background: #e1ecf3;
      transform: translateY(-1px);
    }

    .kecil {
      font-size: 13px;
      color: var(--abu);
    }

    .galat {
      color: var(--merah);
      font-size: 14px;
      min-height: 18px;
      margin-top: 8px;
    }

    /* ===== KAMERA ===== */
    .wadah-kamera {
      position: relative;
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: #0a1520;
      margin-top: 12px;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    video#video {
      width: 100%;
      display: block;
      max-height: 300px;
      object-fit: cover;
    }

    .garis-scan {
      position: absolute;
      top: 10%;
      left: 10%;
      right: 10%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #5dd9d2, transparent);
      box-shadow: 0 0 12px #5dd9d2;
      animation: animasiScan 2s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes animasiScan {
      0% { top: 15%; opacity: 0.3; }
      50% { top: 80%; opacity: 1; }
      100% { top: 15%; opacity: 0.3; }
    }

    .kotak-target {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      border: 2px dashed rgba(255, 255, 255, 0.7);
      border-radius: 16px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35);
    }

    .kamera-kontrol {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .kamera-kontrol button {
      flex: 1;
      padding: 10px;
      font-size: 14px;
      margin-top: 0;
    }

    .info-status {
      background: linear-gradient(135deg, #edf2f7, #e2eaf0);
      color: var(--biru);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-top: 10px;
      display: none;
      font-weight: 600;
      border: 1px solid rgba(0,0,0,.04);
    }

    /* ===== FORM LAPORAN & OPSI MASALAH ===== */
    .id-meja {
      background: linear-gradient(135deg, #f0f6fa 0%, #e4edf4 100%);
      border-left: 5px solid var(--teal);
      padding: 14px 18px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 15px;
      color: var(--biru);
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .badge-properti-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      width: fit-content;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-prop-meja { background: #ebf5ff; color: #2b6cb0; border: 1px solid #bee3f8; }
    .badge-prop-proyektor { background: #faf5ff; color: #6b46c1; border: 1px solid #e9d8fd; }
    .badge-prop-papan { background: #fffaf0; color: #c05621; border: 1px solid #feebc8; }
    .badge-prop-kursi { background: #e6fffa; color: #234e52; border: 1px solid #b2f5ea; }
    .badge-prop-ac { background: #e6fffa; color: #0987a0; border: 1px solid #b2f5ea; }
    .badge-prop-listrik { background: #fffff0; color: #b7791f; border: 1px solid #fefcbf; }
    .badge-prop-fasilitas { background: #edf2f7; color: #4a5568; border: 1px solid #e2e8f0; }

    /* Category Switcher Tabs */
    .kategori-tabs {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 4px 2px 10px;
      margin: 8px 0 12px;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }

    .kategori-tabs::-webkit-scrollbar {
      height: 5px;
    }
    .kategori-tabs::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    .tab-kategori {
      background: #f1f5f9;
      color: var(--biru);
      border: 1.5px solid #d8e2ea;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: auto;
      margin-top: 0;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .tab-kategori:hover {
      background: #e2e8f0;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    .tab-kategori.aktif {
      background: linear-gradient(135deg, var(--teal), var(--teal-tua));
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 4px 10px rgba(49, 151, 149, 0.3);
      transform: translateY(-1px);
    }

    .tab-kategori .hitung-opsi {
      background: rgba(0, 0, 0, 0.08);
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: 800;
    }

    .tab-kategori.aktif .hitung-opsi {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
    }

    /* Search Box */
    .cari-masalah-box {
      position: relative;
      margin-bottom: 12px;
    }

    .cari-masalah-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--abu);
      font-size: 14px;
      pointer-events: none;
    }

    .cari-masalah-box input {
      padding-left: 38px;
      font-size: 13.5px;
      padding-top: 9px;
      padding-bottom: 9px;
      background: #f8fafc;
      border-radius: 12px;
    }

    /* Problem Option Cards / Buttons */
    .wadah-opsi-masalah {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
      margin-top: 6px;
      margin-bottom: 14px;
    }

    .tombol-opsi {
      background: #ffffff;
      color: var(--teks);
      border: 1.5px solid #dbe6ee;
      border-radius: 14px;
      padding: 12px 14px;
      text-align: left;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      width: 100%;
      margin: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    .tombol-opsi:hover {
      background: #f8fafc;
      border-color: #319795;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(44, 74, 90, 0.08);
    }

    .tombol-opsi .opsi-ikon-box {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #edf4f8;
      color: var(--biru);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .tombol-opsi .opsi-konten {
      flex: 1;
      min-width: 0;
    }

    .tombol-opsi .opsi-judul {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--teks);
      line-height: 1.3;
      margin-bottom: 3px;
    }

    .tombol-opsi .opsi-deskripsi {
      font-size: 11px;
      color: var(--abu);
      line-height: 1.3;
      margin-bottom: 5px;
    }

    .tombol-opsi .opsi-meta {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-urgensi {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .badge-urgensi-tinggi {
      background: #fff5f5;
      color: #c53030;
      border: 1px solid #feb2b2;
    }

    .badge-urgensi-sedang {
      background: #fffaf0;
      color: #dd6b20;
      border: 1px solid #fbd38d;
    }

    .badge-urgensi-rendah {
      background: #f0fff4;
      color: #38a169;
      border: 1px solid #9ae6b4;
    }

    .tombol-opsi .opsi-radio {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      flex-shrink: 0;
      font-size: 13px;
      transition: all 0.2s ease;
      margin-top: 2px;
      background: #fff;
    }

    /* Selected state */
    .tombol-opsi.terpilih {
      background: linear-gradient(135deg, #234e52 0%, #17383b 100%);
      border-color: #319795;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(35, 78, 82, 0.32);
    }

    .tombol-opsi.terpilih .opsi-judul {
      color: #ffffff;
    }

    .tombol-opsi.terpilih .opsi-deskripsi {
      color: rgba(255, 255, 255, 0.8);
    }

    .tombol-opsi.terpilih .opsi-ikon-box {
      background: rgba(255, 255, 255, 0.2);
      color: #5dd9d2;
    }

    .tombol-opsi.terpilih .opsi-radio {
      border-color: #5dd9d2;
      background: #319795;
      color: #ffffff;
    }

    .tombol-opsi.terpilih .badge-urgensi-tinggi {
      background: rgba(254, 178, 178, 0.25);
      color: #fed7d7;
      border-color: rgba(254, 178, 178, 0.4);
    }

    .tombol-opsi.terpilih .badge-urgensi-sedang {
      background: rgba(251, 211, 141, 0.25);
      color: #feebc8;
      border-color: rgba(251, 211, 141, 0.4);
    }

    .tombol-opsi.terpilih .badge-urgensi-rendah {
      background: rgba(154, 230, 180, 0.25);
      color: #c6f6d5;
      border-color: rgba(154, 230, 180, 0.4);
    }

    /* Selected banner */
    .banner-terpilih {
      background: linear-gradient(135deg, #e6fffa 0%, #f0fdf4 100%);
      border: 1.5px solid #81e6d9;
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 10px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: #234e52;
      animation: fadeIn 0.2s ease;
    }

    .banner-terpilih i {
      font-size: 22px;
      color: var(--teal);
      flex-shrink: 0;
    }

    .banner-terpilih-detail {
      flex: 1;
      min-width: 0;
      line-height: 1.4;
    }

    .pilihan {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 6px;
    }

    .chip {
      background: #f0f4f8;
      color: var(--biru);
      border: 1.5px solid #d2dfe7;
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 13.5px;
      width: auto;
      font-weight: 600;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .chip:hover {
      background: #e2eaf1;
      border-color: #b3c7d6;
      transform: translateY(-1px);
    }

    .chip.aktif {
      background: linear-gradient(135deg, var(--teal), var(--teal-tua));
      color: var(--putih);
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(49, 151, 149, 0.3);
      transform: translateY(-1px);
    }

    /* ===== PROGRESS STEPS ===== */
    .langkah {
      display: flex;
      justify-content: space-between;
      margin: 20px 0 10px;
    }

    .titik {
      flex: 1;
      text-align: center;
      font-size: 12px;
      color: var(--abu);
      position: relative;
      font-weight: 500;
    }

    .titik span {
      display: block;
      width: 34px;
      height: 34px;
      line-height: 34px;
      margin: 0 auto 8px;
      border-radius: 50%;
      background: #d0dae0;
      color: var(--putih);
      font-weight: 700;
      font-size: 14px;
      transition: all 0.3s;
    }

    .titik.selesai span {
      background: linear-gradient(135deg, var(--teal), var(--teal-tua));
      box-shadow: 0 2px 8px rgba(49, 151, 149, 0.3);
    }

    .titik.selesai {
      color: var(--teks);
      font-weight: 700;
    }

    .sukses {
      background: linear-gradient(135deg, #e3f9f4, #d0f0ea);
      color: var(--teal-tua);
      padding: 14px 16px;
      border-radius: 12px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(49, 151, 149, 0.15);
    }

    .baris {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #edf1f5;
      font-size: 14px;
    }

    .baris:last-of-type {
      border-bottom: none;
    }

    .baris b {
      text-align: right;
      max-width: 60%;
    }

    /* ===== RIWAYAT LAPORAN ===== */
    .item-laporan {
      display: block;
      padding: 14px 16px;
      margin-top: 10px;
      background: var(--biru-muda);
      border-radius: 12px;
      text-decoration: none;
      color: var(--teks);
      font-size: 14px;
      border: 1px solid rgba(0, 0, 0, .04);
      transition: all 0.15s;
    }

    .item-laporan:hover {
      background: #dbe5ed;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .item-laporan b {
      color: var(--biru);
    }

    .foto-kecil {
      max-width: 140px;
      border-radius: 10px;
      display: block;
      margin-left: auto;
      border: 2px solid #e3eaef;
    }

    /* ===== FOOTER ===== */
    .footer-mhs {
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: var(--abu);
    }

    .hidden {
      display: none;
    }

    /* ===== POLISH ===== */
    html { scroll-behavior: smooth; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    main { animation: fadeInUp 0.45s ease both; }

    button:active {
      transform: scale(0.96) !important;
    }

    .kartu {
      transition: box-shadow 0.25s ease;
    }

    .item-laporan {
      position: relative;
      overflow: hidden;
    }
    .item-laporan::after {
      content: '';
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-family: 'bootstrap-icons';
      content: '\F285';
      color: var(--teal);
      font-size: 16px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .item-laporan:hover::after {
      opacity: 0.6;
    }

    .chip {
      transition: all 0.2s ease;
    }
    .chip:active {
      transform: scale(0.95);
    }

    .langkah {
      position: relative;
    }
    .langkah::before {
      content: '';
      position: absolute;
      top: 17px;
      left: 15%;
      right: 15%;
      height: 3px;
      background: #e2e8f0;
      z-index: 0;
      border-radius: 2px;
    }
    .titik {
      position: relative;
      z-index: 1;
    }
    .titik span {
      border: 3px solid var(--biru-muda);
    }

    .wadah-kamera {
      border: 2px solid rgba(93, 217, 210, 0.3);
    }

    .id-meja {
      position: relative;
      overflow: hidden;
    }
    .id-meja::after {
      content: '';
      position: absolute;
      top: -10px; right: -10px;
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(49, 151, 149, 0.08);
    }

    .footer-mhs {
      border-top: 1px solid rgba(0,0,0,0.06);
      margin-top: 12px;
    }

    /* Toast */
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(20px); }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 400px) {
      header h1 { font-size: 18px; }
      header small { font-size: 11px; }
      .kartu { padding: 16px; }
      .titik { font-size: 11px; }

          { teks: "Stop Kontak Dinding Rusak / Lepas", urgensi: "Tinggi", ikon: "bi-plugin", deskripsi: "Colokan kendor, copot, atau konslet" },
          { teks: "Saklar Lampu Rusak / Konslet", urgensi: "Tinggi", ikon: "bi-toggle-off", deskripsi: "Saklar macet atau tercium bau konslet" }
        ]

      fasilitas: {

        masalah: [

          { teks: "Engsel Pintu / Jendela Rusak", urgensi: "Sedang", ikon: "bi-door-open-fill", deskripsi: "Engsel seret atau berderit kencang" },
          { teks: "Kaca Jendela Retak / Pecah", urgensi: "Tinggi", ikon: "bi-shield-exclamation", deskripsi: "Kaca rentan jatuh dan membahayakan" },
          { teks: "Lemari / Loker Kelas Rusak", urgensi: "Sedang", ikon: "bi-archive-fill", deskripsi: "Pintu lemari lepas atau ambalan patah" },
          { teks: "Masalah Lainnya", urgensi: "Sedang", ikon: "bi-three-dots", deskripsi: "Tuliskan kendala spesifik pada catatan detail" }
        ]
      }
    };

    // Daftar flat untuk backwards compatibility
    const daftarMasalah = [];
    for (const _k in KATALOG_MASALAH) {
      KATALOG_MASALAH[_k].masalah.forEach(_m => {
        if (!daftarMasalah.includes(_m.teks)) daftarMasalah.push(_m.teks);
      });
    }

    let kategoriMasalahAktif = "meja";
    let kataKunciCariMasalah = "";

    function deteksiKategoriDariJenis(jenis) {
      const j = (jenis || "").toLowerCase();
      if (j.includes("proyektor") || j.includes("lcd") || j.includes("infocus")) return "proyektor";
      if (j.includes("papan") || j.includes("whiteboard")) return "papan";
      if (j.includes("kursi") || j.includes("bangku")) return "kursi";
      if (j.includes("ac") || j.includes("pendingin") || j.includes("kipas")) return "ac";
      if (j.includes("lampu") || j.includes("listrik") || j.includes("saklar") || j.includes("stop kontak")) return "listrik";
      if (j.includes("pintu") || j.includes("jendela") || j.includes("lemari") || j.includes("loker")) return "fasilitas";
      return "meja";
    }

    function dapatkanIkonJenis(jenis) {
      const kat = deteksiKategoriDariJenis(jenis);
      return (KATALOG_MASALAH[kat] && KATALOG_MASALAH[kat].ikon) || "bi-box-seam";
    }


    let pengguna = null;
    try {
      const dataSesi = JSON.parse(localStorage.getItem(KUNCI_USER) || "null");
      if (dataSesi && dataSesi.username) {
        pengguna = dataSesi;
      } else {
        localStorage.removeItem(KUNCI_USER);
      }
    } catch (e) {
      pengguna = null;
    }
    let streamKamera = null;
    let timerScan = null;
    let masalahDipilih = "";
    let daftarDeviceKamera = [];
    let indeksKameraAktif = 0;
    let sedangMemprosesScan = false;
    let kanvasScan = null;

    // ====== FUNCTION BANTUAN ======
    function cariMeja(id) {
      if (!id) return null;
      const semua = bacaMeja();
      for (let i = 0; i < semua.length; i++) {
        if (semua[i] && semua[i].id && String(semua[i].id).toUpperCase() === String(id).toUpperCase()) return semua[i];
      }
      return null;
    }

    function namaLokasi(meja) {
      return meja.gedung + " - " + meja.ruang + " - " + (meja.jenis || "Meja") + " #" + meja.id;
    }

    function hitungUrgensi(masalah) {
      if (!masalah) return "Sedang";
      for (const k in KATALOG_MASALAH) {
        const item = KATALOG_MASALAH[k].masalah.find(m => m.teks === masalah);
        if (item && item.urgensi) return item.urgensi;
      }
      const mLow = masalah.toLowerCase();
      if (mLow.includes("mati") || mLow.includes("patah") || mLow.includes("bocor") || mLow.includes("konslet") || mLow.includes("tinggi") || mLow.includes("goyang keras")) {
        return "Tinggi";
      }
      if (mLow.includes("kotor") || mLow.includes("coretan") || mLow.includes("lengan") || mLow.includes("rendah")) {
        return "Rendah";
      }
      return "Sedang";
    }

    function estimasiPerbaikan(status) {
      switch (status) {
        case "Dikirim":
          return "Estimasi perbaikan: 2-3 hari kerja";
        case "Sedang Diproses":
          return "Estimasi perbaikan: 1-2 hari kerja";
        case "Selesai Diperbaiki":
          return "Perbaikan sudah selesai. Terima kasih!";
        default:
          return "-";
      }
    }

    function cariLaporan(id) {
      const data = bacaLaporan();
      for (let item of data) {
        if (item.id === id) return item;
      }
      return null;
    }

    function hentikanKameraStream() {
      if (timerScan) {
        clearInterval(timerScan);
        timerScan = null;
      }
      if (streamKamera) {
        streamKamera.getTracks().forEach(t => t.stop());
        streamKamera = null;
      }
      const video = document.getElementById("video");
      if (video) video.srcObject = null;
    }

    function hentikanKamera() {
      hentikanKameraStream();
      const wadahKamera = document.getElementById("wadah-kamera");
      if (wadahKamera) wadahKamera.classList.add("hidden");
      const kontrolKamera = document.getElementById("kontrol-kamera");
      if (kontrolKamera) kontrolKamera.classList.add("hidden");
      const btnBuka = document.getElementById("btn-buka-kamera");
      if (btnBuka) btnBuka.innerHTML = '<i class="bi bi-camera-video"></i> Buka Kamera & Scan';
      const infoStatus = document.getElementById("info-status");
      if (infoStatus) infoStatus.style.display = "none";
      sedangMemprosesScan = false;
    }

    function tampil(html) {
      document.getElementById("isi").innerHTML = html;
    }

    function sekarang() {
      const d = new Date();
      const dua = n => String(n).padStart(2, "0");
      return d.getFullYear() + "-" + dua(d.getMonth() + 1) + "-" + dua(d.getDate()) + " " + dua(d.getHours()) + ":" +
        dua(d.getMinutes());
    }

    // ====== ROUTER (hash) ======
    function router() {
      if (!dataSiap()) return;
      hentikanKamera();
      const hash = location.hash || "#/report";
      const bagian = hash.slice(1).split("?");
      const path = bagian[0];
      const params = new URLSearchParams(bagian[1] || "");
      const queryParams = new URLSearchParams(window.location.search);
      const deskId = params.get("deskId") || queryParams.get("deskId");

      if (path.startsWith("/status/")) {
        layarStatus(path.replace("/status/", ""));
      } else if (pengguna === null) {
        layarLogin(deskId);
      } else if (deskId) {
        layarForm(deskId);
      } else {
        layarScan();
      }
    }
    window.addEventListener("hashchange", router);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && streamKamera) {
        hentikanKamera();
      }
    });

    // ====== LAYAR 1: LOGIN ======
    function toggleLihatPass(idInput, idIkon) {
      const input = document.getElementById(idInput);
      const ikon = document.getElementById(idIkon);
      if (!input) return;
      if (input.type === "password") {
        input.type = "text";
        if (ikon) {
          ikon.classList.remove("bi-eye");
          ikon.classList.add("bi-eye-slash");
        }
      } else {
        input.type = "password";
        if (ikon) {
          ikon.classList.remove("bi-eye-slash");
          ikon.classList.add("bi-eye");
        }
      }
    }

    function layarLogin(targetDeskId = null) {
      const infoMeja = targetDeskId ? `
        <div style="background:linear-gradient(135deg,#edf2f7,#e2eaf0);border-left:4px solid var(--teal);padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:13px;display:flex;align-items:center;gap:8px;">
          <i class="bi bi-geo-alt-fill" style="color:var(--teal);font-size:16px;"></i> <span>Anda memindai perabot <b>${targetDeskId.toUpperCase()}</b>. Silakan login terlebih dahulu untuk melanjutkan pelaporan.</span>
        </div>` : "";

      tampil(`
    <div class="kartu">
      <h2><i class="bi bi-person-circle"></i> Login Mahasiswa</h2>
      <p class="kecil" style="margin-bottom:16px;">Silakan login dengan username dan password yang sudah terdaftar di sistem sebelum mengirim laporan.</p>
      ${infoMeja}
      <form id="formLogin" onsubmit="event.preventDefault(); prosesLogin('${targetDeskId || ''}');">
        <label for="loginUser">Username</label>
        <input type="text" id="loginUser" placeholder="contoh: ptik_rbl1" autocomplete="username" autofocus required>
        
        <label for="loginPass">Password</label>
        <div style="position:relative;display:flex;align-items:center;">
          <input type="password" id="loginPass" placeholder="Masukkan password" autocomplete="current-password" required style="padding-right:42px;">
          <button type="button" onclick="toggleLihatPass('loginPass', 'ikonMataMhs')" style="position:absolute;right:8px;background:none;border:none;color:var(--abu);cursor:pointer;padding:6px;font-size:16px;line-height:1;width:auto;margin:0;" title="Tampilkan/Sembunyikan Password" tabindex="-1">
            <i class="bi bi-eye" id="ikonMataMhs"></i>
          </button>
        </div>
        
        <div class="galat" id="galat"></div>
        <button type="submit" id="btnMasuk" class="utama"><i class="bi bi-box-arrow-in-right"></i> Masuk</button>
      </form>
      <p class="kecil" style="margin-top:16px;color:var(--abu);text-align:center;">
        Akun mahasiswa telah disediakan pada database Firestore (tabel <i>users</i>).
      </p>
    </div>`);
    }

    async function prosesLogin(targetDeskId = "") {
      const userEl = document.getElementById("loginUser");
      const passEl = document.getElementById("loginPass");
      const galat = document.getElementById("galat");
      const btn = document.getElementById("btnMasuk");

      if (!userEl || !passEl) return;
      const username = userEl.value.trim();
      const password = passEl.value;

      if (!username || !password) {
        if (galat) galat.textContent = "Harap masukkan username dan password.";
        return;
      }

      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="bi bi-hourglass-split"></i> Memverifikasi...`;
      }
      if (galat) galat.textContent = "";

      try {
        const user = await loginMahasiswa(username, password);
        pengguna = user;
        localStorage.setItem(KUNCI_USER, JSON.stringify(pengguna));

        const hashQuery = (location.hash.split("?")[1]) || "";
        const hashParams = new URLSearchParams(hashQuery);
        const searchParams = new URLSearchParams(window.location.search);
        const target = targetDeskId || hashParams.get("deskId") || searchParams.get("deskId");

        if (target) {
          location.hash = "#/report?deskId=" + target.toUpperCase();
        } else {
          location.hash = "#/report";
        }
        router();
      } catch (err) {
        if (galat) galat.textContent = err.message || "Gagal masuk. Periksa kembali username dan password.";
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<i class="bi bi-box-arrow-in-right"></i> Masuk`;
        }
      }
    }

    function logout() {
      localStorage.removeItem(KUNCI_USER);
      pengguna = null;
      location.hash = "#/report";
      router();
    }

    // ====== SCAN BARCODE ======
    function layarScan() {
      if (!pengguna || !pengguna.username) {
        layarLogin();
        return;
      }
      const userKey = (pengguna.username || pengguna.nama || "").toLowerCase();
      const laporanSaya = bacaLaporan().filter(l => l.pelapor && l.pelapor.toLowerCase().includes(userKey));
      let riwayat = "";
      for (let l of laporanSaya) {
        const ikonStatus = l.status === "Selesai Diperbaiki" ? "bi-check-circle-fill" : l.status === "Sedang Diproses" ? "bi-gear-fill" : "bi-send-fill";
        riwayat +=
          `<a class="item-laporan" href="#/status/${l.id}"><b>${l.id}</b> — ${l.masalah}<br><span class="kecil"><i class="bi ${ikonStatus}"></i> ${l.status} · ${l.waktu || ""}</span></a>`;
      }
      tampil(`
    <div class="kartu">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
        <div>
          <h2 style="margin:0;">Halo, ${pengguna.nama || pengguna.username}!</h2>
          <small class="kecil">Akun: <b>${pengguna.username}</b></small>
        </div>
        <button type="button" class="sekunder" style="width:auto;margin:0;padding:7px 14px;font-size:13px;" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Keluar</button>
      </div>
      <p class="kecil" style="margin-top:10px;">Arahkan kamera ke barcode/QR di meja atau pilih foto QR.</p>

      <!-- Wadah Video Kamera -->
      <div id="wadah-kamera" class="wadah-kamera hidden">
        <video id="video" autoplay playsinline muted></video>
        <div class="kotak-target"></div>
        <div class="garis-scan"></div>
      </div>

      <div class="kamera-kontrol hidden" id="kontrol-kamera">
        <button type="button" class="sekunder" id="btn-ganti-kamera" onclick="gantiKamera()" style="display:none"><i class="bi bi-arrow-repeat"></i> Ganti Kamera</button>
        <button type="button" class="sekunder" onclick="hentikanKamera()"><i class="bi bi-stop-circle"></i> Tutup Kamera</button>
      </div>

      <div class="galat" id="galat"></div>
      <div class="info-status" id="info-status"></div>

      <button id="btn-buka-kamera" class="utama" onclick="toggleKamera()"><i class="bi bi-camera-video"></i> Buka Kamera & Scan</button>
      <button type="button" class="sekunder" onclick="document.getElementById('inputScanFoto').click()"><i class="bi bi-image"></i> Pilih / Ambil Foto QR</button>
      <input type="file" id="inputScanFoto" accept="image/*" capture="environment" style="display:none" onchange="scanDariFoto(this)">

      <label>Atau ketik ID perabot / properti manual</label>
      <input type="text" id="manual" placeholder="contoh: A101, PRJ-204" onkeydown="if(event.key==='Enter')pakaiManual()">

    }

    async function toggleKamera() {
      if (streamKamera) {
        hentikanKamera();
      } else {
        await mulaiKamera();
      }
    }

    async function mulaiKamera(pilihanDeviceId = null) {
      const galat = document.getElementById("galat");
      const infoStatus = document.getElementById("info-status");
      const wadahKamera = document.getElementById("wadah-kamera");
      const kontrolKamera = document.getElementById("kontrol-kamera");
      const btnBuka = document.getElementById("btn-buka-kamera");
      const video = document.getElementById("video");

      if (galat) galat.innerHTML = "";
      if (infoStatus) {
        infoStatus.style.display = "block";
        infoStatus.textContent = "Menghubungkan ke kamera...";
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        if (infoStatus) infoStatus.style.display = "none";
        const isLocal = location.hostname === "localhost" || location.hostname === "127.0.0.1";
        if (location.protocol !== "https:" && !isLocal) {
          galat.innerHTML = `
            <strong>Kamera diblokir browser (Koneksi HTTP).</strong><br>
            Browser mewajibkan koneksi aman <code>HTTPS</code> atau <code>localhost</code>.<br>
            <em>Solusi:</em> Buka via HTTPS atau gunakan tombol <strong>"Pilih / Ambil Foto QR"</strong> di bawah.
          `;
        } else {
          galat.innerHTML = "Browser ini tidak mengizinkan akses kamera langsung. Silakan gunakan tombol <strong>'Pilih / Ambil Foto QR'</strong> atau masukkan ID manual.";
        }
        return;
      }

      hentikanKameraStream();

      const daftarConstraints = [];
      if (pilihanDeviceId) {
        daftarConstraints.push({
          video: { deviceId: { exact: pilihanDeviceId } },
          audio: false
        });
      }
      daftarConstraints.push({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });
      daftarConstraints.push({
        video: { facingMode: "user" },
        audio: false
      });
      daftarConstraints.push({
        video: true,
        audio: false
      });

      let streamBerhasil = null;
      let errorTerakhir = null;

      for (const konstrain of daftarConstraints) {
        try {
          streamBerhasil = await navigator.mediaDevices.getUserMedia(konstrain);
          if (streamBerhasil) break;
        } catch (e) {
          errorTerakhir = e;
        }
      }

      if (!streamBerhasil) {
        if (infoStatus) infoStatus.style.display = "none";
        let pesan = "Tidak dapat mengakses kamera.";
        if (errorTerakhir) {
          if (errorTerakhir.name === "NotAllowedError" || errorTerakhir.name === "PermissionDeniedError") {
            pesan = "Izin kamera ditolak. Silakan izinkan akses kamera di pengaturan browser/situs Anda.";
          } else if (errorTerakhir.name === "NotFoundError" || errorTerakhir.name === "DevicesNotFoundError") {
            pesan = "Tidak ditemukan perangkat kamera di perangkat Anda.";
          } else if (errorTerakhir.name === "NotReadableError" || errorTerakhir.name === "TrackStartError") {
            pesan = "Kamera sedang dipakai aplikasi lain (seperti Zoom atau tab lain). Tutup aplikasi tersebut.";
          } else if (errorTerakhir.name === "OverconstrainedError") {
            pesan = "Pengaturan kamera tidak didukung perangkat.";
          } else {
            pesan = "Gagal membuka kamera: " + errorTerakhir.message;
          }
        }
        galat.innerHTML = pesan + ` Anda tetap bisa menggunakan tombol <strong>'Pilih / Ambil Foto QR'</strong>.`;
        return;
      }

      streamKamera = streamBerhasil;
      if (video) {
        video.srcObject = streamKamera;
        try {
          await video.play();
        } catch (e) {
          /* abaikan error autoplay */
        }
      }

      if (wadahKamera) wadahKamera.classList.remove("hidden");
      if (kontrolKamera) kontrolKamera.classList.remove("hidden");
      if (btnBuka) btnBuka.innerHTML = '<i class="bi bi-stop-circle"></i> Tutup Kamera';
      if (infoStatus) {
        infoStatus.style.display = "block";
        infoStatus.textContent = "Arahkan kamera ke kode QR di meja...";
      }

      periksaDaftarKamera();
      sedangMemprosesScan = false;
      mulaiPemindaianFrame();
    }

    async function periksaDaftarKamera() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
        const devices = await navigator.mediaDevices.enumerateDevices();
        daftarDeviceKamera = devices.filter(d => d.kind === "videoinput");
        const btnGanti = document.getElementById("btn-ganti-kamera");
        if (btnGanti) {
          btnGanti.style.display = daftarDeviceKamera.length > 1 ? "inline-block" : "none";
        }
      } catch (e) {}
    }

    async function gantiKamera() {
      if (daftarDeviceKamera.length <= 1) return;
      indeksKameraAktif = (indeksKameraAktif + 1) % daftarDeviceKamera.length;
      const deviceId = daftarDeviceKamera[indeksKameraAktif].deviceId;
      await mulaiKamera(deviceId);
    }

    function mulaiPemindaianFrame() {
      if (timerScan) clearInterval(timerScan);

      let detektorNative = null;
      if ("BarcodeDetector" in window) {
        try {
          detektorNative = new BarcodeDetector({
            formats: ["qr_code", "code_128", "ean_13", "code_39"]
          });
        } catch (e) {
          detektorNative = null;
        }
      }

      if (!kanvasScan) {
        kanvasScan = document.createElement("canvas");
      }
      const ctx = kanvasScan.getContext("2d", { willReadFrequently: true });

      timerScan = setInterval(async () => {
        if (!streamKamera || sedangMemprosesScan) return;
        const video = document.getElementById("video");
        if (!video || video.readyState < 2 || video.videoWidth === 0) return;

        sedangMemprosesScan = true;
        try {
          let hasilTeks = null;

          if (detektorNative) {
            try {
              const hasil = await detektorNative.detect(video);
              if (hasil && hasil.length > 0 && hasil[0].rawValue) {
                hasilTeks = hasil[0].rawValue;
              }
            } catch (errDet) {}
          }

          if (!hasilTeks && typeof jsQR === "function") {
            const lebar = video.videoWidth;
            const tinggi = video.videoHeight;
            const maksDim = 640;
            const skala = Math.min(1, maksDim / Math.max(lebar, tinggi));
            kanvasScan.width = Math.round(lebar * skala);
            kanvasScan.height = Math.round(tinggi * skala);

            ctx.drawImage(video, 0, 0, kanvasScan.width, kanvasScan.height);
            const imgData = ctx.getImageData(0, 0, kanvasScan.width, kanvasScan.height);
            const kode = jsQR(imgData.data, imgData.width, imgData.height, {
              inversionAttempts: "dontInvert"
            });
            if (kode && kode.data) {
              hasilTeks = kode.data;
            }
          }

          if (hasilTeks) {
            bunyikanBeep();
            pakaiKode(hasilTeks);
          }
        } catch (e) {
          /* abaikan error per frame */
        } finally {
          sedangMemprosesScan = false;
        }
      }, 250);
    }

    async function scanDariFoto(input) {
      const file = input.files && input.files[0];
      if (!file) return;

      const galat = document.getElementById("galat");
      const infoStatus = document.getElementById("info-status");
      if (galat) galat.textContent = "";
      if (infoStatus) {
        infoStatus.style.display = "block";
        infoStatus.textContent = "Memproses gambar QR...";
      }

      try {
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error("Gagal membaca file gambar."));
          reader.readAsDataURL(file);
        });

        const img = new Image();
        await new Promise((resolve, reject) => {
          img.onload = () => resolve();
          img.onerror = () => reject(new Error("File bukan gambar yang valid."));
          img.src = dataUrl;
        });

        let hasilTeks = null;

        if ("BarcodeDetector" in window) {
          try {
            const detektor = new BarcodeDetector({ formats: ["qr_code", "code_128", "ean_13", "code_39"] });
            const hasil = await detektor.detect(img);
            if (hasil && hasil.length > 0 && hasil[0].rawValue) {
              hasilTeks = hasil[0].rawValue;
            }
          } catch (e) {}
        }

        if (!hasilTeks && typeof jsQR === "function") {
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const kode = jsQR(imgData.data, imgData.width, imgData.height, {
            inversionAttempts: "attemptBoth"
          });
          if (kode && kode.data) {
            hasilTeks = kode.data;
          }
        }

        if (infoStatus) infoStatus.style.display = "none";

        if (hasilTeks) {
          bunyikanBeep();
          pakaiKode(hasilTeks);
        } else {
          if (galat) {
            galat.innerHTML = "Kode QR tidak terdeteksi pada gambar. Pastikan foto fokus dan kode QR terlihat jelas, atau ketik ID meja manual.";
          }
        }
      } catch (err) {
        if (infoStatus) infoStatus.style.display = "none";
        if (galat) galat.textContent = "Gagal memindai gambar: " + err.message;
      } finally {
        input.value = "";
      }
    }

    function bunyikanBeep() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(800, ctx.currentTime);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.15);
        }
        if (navigator.vibrate) {
          navigator.vibrate(100);
        }
      } catch (e) {}
    }

    function ekstrakDeskId(teks) {
      if (!teks) return "";
      let str = String(teks).trim();
      try {
        if (str.startsWith("http://") || str.startsWith("https://")) {
          const url = new URL(str);
          if (url.searchParams.get("deskId")) {
            return url.searchParams.get("deskId").trim().toUpperCase();
          }
          if (url.hash && url.hash.includes("deskId=")) {
            const hashQuery = url.hash.split("?")[1] || "";
            const hashParams = new URLSearchParams(hashQuery);
            if (hashParams.get("deskId")) return hashParams.get("deskId").trim().toUpperCase();
          }
        }
      } catch (e) {}

      if (str.includes("deskId=")) {
        str = str.split("deskId=")[1].split("&")[0].split("#")[0];
      }
      str = str.replace(/^[^\w]+|[^\w]+$/g, "");
      return str.toUpperCase();
    }

    function pakaiKode(teks) {
      const id = ekstrakDeskId(teks);
      const galat = document.getElementById("galat");

      if (!id) {
        if (galat) galat.textContent = "Kode QR tidak valid atau kosong.";
        return;
      }

      if (cariMeja(id) === null) {
        if (galat) galat.textContent = 'Properti / Perabot "' + id + '" tidak ditemukan.';
        return;
      }

      hentikanKamera();
      location.hash = "#/report?deskId=" + id;
    }

    function pakaiManual() {
      const input = document.getElementById("manual");
      if (input) pakaiKode(input.value);
    }

    function renderTabKategori(katAktif) {
      let html = "";
      for (const key in KATALOG_MASALAH) {

        html += `

            <i class="bi ${item.ikon}"></i>
            <span>${item.nama}</span>
            <span class="hitung-opsi">${item.masalah.length}</span>
          </button>`;
      }
      return html;
    }

    function renderDaftarOpsiMasalah(katKey, cari = "") {
      const filterCari = cari.trim().toLowerCase();
      let daftar = [];

      if (filterCari) {
        for (const k in KATALOG_MASALAH) {
          const matched = KATALOG_MASALAH[k].masalah.filter(m =>
            m.teks.toLowerCase().includes(filterCari) ||
            m.deskripsi.toLowerCase().includes(filterCari) ||
            KATALOG_MASALAH[k].nama.toLowerCase().includes(filterCari)
          );
          daftar.push(...matched);
        }
      } else {
        daftar = KATALOG_MASALAH[katKey] ? KATALOG_MASALAH[katKey].masalah : [];
      }

      if (daftar.length === 0) {
        return `
          <div style="grid-column: 1 / -1; text-align: center; padding: 24px 10px; color: var(--abu); background: #f8fafc; border-radius: 12px; border: 1.5px dashed #d8e2ea;">

            <p style="margin: 8px 0 0; font-size: 13.5px; font-weight: 600;">Tidak ditemukan opsi masalah yang cocok</p>
            <small class="kecil">Coba gunakan kata kunci lain atau pilih opsi Masalah Lainnya.</small>
          </div>`;
      }

      let html = "";
      daftar.forEach((m) => {
        const isTerpilih = masalahDipilih === m.teks;
        const ikonUrgensi = m.urgensi === "Tinggi" ? "🔴" : (m.urgensi === "Sedang" ? "🟡" : "🟢");
        html += `
          <button type="button" class="tombol-opsi ${isTerpilih ? 'terpilih' : ''}" onclick="klikOpsiMasalah('${encodeURIComponent(m.teks)}', '${m.urgensi}')">

            <div class="opsi-konten">
              <div class="opsi-judul">${m.teks}</div>
              <div class="opsi-deskripsi">${m.deskripsi}</div>
              <div class="opsi-meta">
                <span class="badge-urgensi badge-urgensi-${m.urgensi.toLowerCase()}">
                  ${ikonUrgensi} Prioritas ${m.urgensi}
                </span>
              </div>
            </div>
            <div class="opsi-radio">
              <i class="bi ${isTerpilih ? 'bi-check-circle-fill' : 'bi-circle'}"></i>
            </div>
          </button>`;
      });
      return html;
    }

    function pilihMasalah(nomor) {
      if (daftarMasalah[nomor]) {
        const urg = hitungUrgensi(daftarMasalah[nomor]);
        klikOpsiMasalah(encodeURIComponent(daftarMasalah[nomor]), urg);
      }
    }

    function kompresFoto(berkas) {
      return new Promise((selesai, gagal) => {
        const pembaca = new FileReader();
        pembaca.onerror = () => gagal(new Error("Foto tidak bisa dibaca."));
        pembaca.onload = () => {
          const gambar = new Image();
          gambar.onerror = () => gagal(new Error("File yang dipilih bukan gambar."));
          gambar.onload = () => {
            const maks = 800;
            const skala = Math.min(1, maks / Math.max(gambar.width, gambar.height));
            const kanvas = document.createElement("canvas");
            kanvas.width = Math.round(gambar.width * skala);
            kanvas.height = Math.round(gambar.height * skala);
            kanvas.getContext("2d").drawImage(gambar, 0, 0, kanvas.width, kanvas.height);
            selesai(kanvas.toDataURL("image/jpeg", 0.6));
          };
          gambar.src = pembaca.result;
        };
        pembaca.readAsDataURL(berkas);
      });
    }

    async function kirimLaporan(mejaId) {
      if (!pengguna || !pengguna.username) {
        alert("Silakan login terlebih dahulu untuk mengirim laporan.");
        router();
        return;
      }
      if (masalahDipilih === "") {
        document.getElementById("galat").textContent = "Pilih salah satu jenis masalah dulu.";
        return;
      }
      const meja = cariMeja(mejaId);
      const berkas = document.getElementById("foto").files[0];
      const galat = document.getElementById("galat");
      let fotoData = "";
      if (berkas) {
        galat.textContent = "Memproses foto...";
        try {
          fotoData = await kompresFoto(berkas);
        } catch (e) {
          galat.textContent = e.message;
          return;
        }
      }
      const pelaporInfo = pengguna.nama && pengguna.nama !== pengguna.username
        ? `${pengguna.nama} (${pengguna.username})`
        : pengguna.username;

      const laporanBaru = {
        id: buatIdLaporan(),
        mejaId: meja.id,
        lokasi: namaLokasi(meja),
        masalah: masalahDipilih,
        urgensi: hitungUrgensi(masalahDipilih),
        detail: document.getElementById("detail").value.trim(),
        foto: fotoData,
        pelapor: pelaporInfo,
        userId: pengguna.id || null,
        username: pengguna.username,
        status: "Dikirim",
        waktu: sekarang()
      };
      document.getElementById("galat").textContent = "Mengirim...";
      tulisLaporan(laporanBaru).then(() => {
        location.hash = "#/status/" + laporanBaru.id + "?baru=1";
      }).catch(e => {
        document.getElementById("galat").textContent = "Gagal mengirim: " + e.message;
      });
    }

    // ====== STATUS ======
    function layarStatus(idLaporan) {
      const bersih = idLaporan.split("?")[0];
      const lap = cariLaporan(bersih);
      if (lap === null) {
        tampil(
          `<div class="kartu"><h2>Laporan tidak ditemukan</h2><button class="sekunder" onclick="location.hash='#/report'">Kembali</button></div>`
          );
        return;
      }
      const baru = location.hash.includes("baru=1");
      const posisi = urutanStatus.indexOf(lap.status);
      let progres = "";
      for (let i = 0; i < urutanStatus.length; i++) {
        progres +=
          `<div class="titik ${i <= posisi ? "selesai" : ""}"><span>${i <= posisi ? '<i class="bi bi-check-lg"></i>' : i + 1}</span>${urutanStatus[i]}</div>`;
      }
      tampil(`
    <div class="kartu">
      ${baru ? `<div class="sukses"><i class="bi bi-check-circle-fill"></i> Laporan berhasil dikirim!</div>` : ""}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <h2 style="margin:0;"><i class="bi bi-info-circle"></i> Status ${lap.id}</h2>
        ${pengguna ? `<button type="button" class="sekunder" style="width:auto;margin:0;padding:7px 14px;font-size:13px;" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Keluar</button>` : ""}
      </div>
      <div class="langkah">${progres}</div>
      <p style="margin:16px 0;"><b>${estimasiPerbaikan(lap.status)}</b></p>
      <div class="baris"><span>Lokasi</span><b>${lap.lokasi}</b></div>
      <div class="baris"><span>Masalah</span><b>${lap.masalah}</b></div>
      <div class="baris"><span>Urgensi</span><b>${lap.urgensi}</b></div>
      <div class="baris"><span>Detail</span><b>${lap.detail || "-"}</b></div>
      <div class="baris"><span>Pelapor</span><b>${lap.pelapor || "-"}</b></div>
      <div class="baris"><span>Foto</span><b>${lap.foto && lap.foto.startsWith("data:image") ? `<img class="foto-kecil" src="${lap.foto}" alt="Foto laporan">` : "-"}</b></div>
      <div class="baris"><span>Dikirim</span><b>${lap.waktu}</b></div>
      <button class="utama" onclick="location.hash='#/report'"><i class="bi bi-plus-circle"></i> Buat Laporan Baru</button>
    </div>`);
    }

    // Data online
    let sudahMulai = false;
    saatDataBerubah(() => {
      if (!dataSiap()) return;
      if (!sudahMulai) {
        sudahMulai = true;
        router();
        return;
      }
      if (location.hash.startsWith("#/status/")) router();
    });
    tampil('<div class="kartu" style="text-align:center;padding:40px;"><i class="bi bi-hourglass-split" style="font-size:28px;color:var(--teal);display:block;margin-bottom:12px;"></i><p style="margin:0;color:var(--abu);">Memuat data...</p></div>');
    mulaiDb();
  </script>
</body>

</html>
